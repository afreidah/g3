# -------------------------------------------------------------------------------
# Build and push the container images on every merge to main, record the
# released version, and start the deployment that rolls it out.
#
# Author: Alex Freidah
#
# This file runs only on a Forgejo instance -- GitHub ignores .forgejo/workflows.
# Its presence is also what stops Forgejo from falling back to .github/workflows,
# which targets GitHub-hosted runners and fails on a self-hosted one.
#
# Nothing here is scoped to changed paths. The repository reaches Forgejo through
# a mirror whose pushes are force-updated and can batch several commits, so a
# push event's own commit range does not reliably describe what changed. A filter
# that silently skips a build is worse than always building.
#
# `make push` tags from .version, so a merge that does not bump it republishes
# that tag from current main.
# -------------------------------------------------------------------------------

name: Images

on:
  push:
    branches: [main]

jobs:
  images:
    name: Build and push images
    runs-on: build
    steps:
      # The Hugo theme lives in a git submodule. Without `submodules` the
      # checkout leaves web/themes/hugo-theme-relearn empty, Hugo happily builds
      # against an empty theme, and `make web-push` only fails once the site
      # reaches the first theme shortcode it cannot resolve.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # An empty theme is silent until Hugo renders, so check it here rather
      # than partway through a multi-arch docker build.
      - name: Verify theme submodule
        run: |
          set -euo pipefail
          if [ ! -f web/themes/hugo-theme-relearn/layouts/shortcodes/badge.html ]; then
            echo "web/themes/hugo-theme-relearn is not checked out" >&2
            exit 1
          fi

      - name: Build and push
        run: |
          set -euo pipefail

          # The build host carries no qemu handlers, so without this buildx
          # reports amd64 only and the arm64 half of each image fails.
          docker run --privileged --rm tonistiigi/binfmt --install all

          make push
          make web-push

      # The deployment reads its version from this key, so it is written only
      # once the images above exist under that tag.
      - name: Record the released version
        env:
          CONSUL_HTTP_ADDR: http://127.0.0.1:8500
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          version=$(cat .version)
          consul kv put deploy/versions/g3 "$version"

          # Read back, so a silently-accepted write cannot pass as a success.
          got=$(consul kv get deploy/versions/g3)
          [ "$got" = "$version" ] || {
            echo "::error::readback mismatch: stored $got, expected $version"
            exit 1
          }
          echo "recorded ${got}"

      - name: Start the deployment
        env:
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: token ${RELEASE_DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"app":"g3"}}' \
            http://forgejo.service.consul:30028/api/v1/repos/alex/munchbox/actions/workflows/deploy-version.yml/dispatches
