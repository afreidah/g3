# -------------------------------------------------------------------------------
# SonarCloud Project Configuration
#
# Author: Alex Freidah
#
# Used by the CI sonarqube job. Declares the project key/org, the Go coverage
# report path, and the directories excluded from analysis or from the coverage
# metric (generated code, process entry points, and the external-I/O clients
# that aren't unit-testable).
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_g3
sonar.organization=afreidah

# Coverage produced by `go test -coverprofile=coverage.out` in the test job.
sonar.go.coverage.reportPaths=coverage.out

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Excluded from analysis -- generated code (gomock mocks and sqlc query code)
# is not authored by hand and should not be flagged for smells or duplication.
sonar.exclusions=**/*_test.go,internal/server/mock_backend.go,internal/server/mock_authenticator.go,internal/store/sqlc/**

# Not counted toward the coverage metric -- generated code, process entry points
# (cmd/g3 subcommands that call os.Exit), the HTTP transport entry (ServeHTTP),
# and the Gmail/Drive/Postgres clients that require a live backend. These have no
# isolatable logic to unit-test; the logic that uses them is covered via fakes.
sonar.coverage.exclusions=internal/server/mock_backend.go,internal/server/mock_authenticator.go,internal/backend/gmail.go,internal/backend/gmail_list.go,internal/backend/gmail_chunked.go,internal/store/postgres.go,internal/store/sqlc/**,internal/cli/shared.go,internal/cli/synccmd/sync_interfaces.go,internal/cli/authcmd/auth.go,internal/cli/authcmd/auth_interfaces.go,internal/cli/servecmd/serve.go,cmd/g3/main.go

sonar.sourceEncoding=UTF-8
