version: "2"

linters:
  enable:
    - gocritic
    - misspell
    - sloglint

  settings:
    errcheck:
      # CLI commands write status to stdout/stderr; a failed terminal write is
      # not actionable, matching the convention for fmt.Print* on os.Stdout.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - exitAfterDefer
        - hugeParam

    sloglint:
      context: "all"

  exclusions:
    paths:
      - "mock_.*\\.go$"
      - ".*_generated\\.go$"
