# -------------------------------------------------------------------------------
# GoReleaser Configuration - Release Automation
#
# Author: Alex Freidah
#
# Builds multi-arch binaries, Debian packages, and GitHub Releases.
# Triggered by version tag pushes (v*) via GitHub Actions.
# -------------------------------------------------------------------------------

version: 2

builds:
  - main: ./cmd/g3
    binary: g3
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/afreidah/g3/internal/telemetry.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: deb
    package_name: g3
    vendor: Munchbox
    homepage: https://github.com/afreidah/g3
    maintainer: Alex Freidah <alex.freidah@gmail.com>
    description: |
      S3-compatible HTTP gateway backed by Gmail.
      Stores objects as emails with metadata in the body and data as
      attachments. Designed for write-once/read-rarely backup workloads.
    section: admin
    priority: optional
    formats:
      - deb
    dependencies:
      - systemd
    contents:
      - src: ./packaging/g3.service
        dst: /usr/lib/systemd/system/g3.service
        file_info:
          mode: 0644

      - dst: /etc/g3
        type: dir
        file_info:
          mode: 0750

      - src: ./packaging/config.example.yaml
        dst: /etc/g3/config.example.yaml
        type: config
        file_info:
          mode: 0640

      - src: ./packaging/copyright
        dst: /usr/share/doc/g3/copyright
        file_info:
          mode: 0644

      - src: ./packaging/changelog.gz
        dst: /usr/share/doc/g3/changelog.Debian.gz
        file_info:
          mode: 0644

    scripts:
      postinstall: ./packaging/postinst
      preremove: ./packaging/prerm
      postremove: ./packaging/postrm

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: afreidah
    name: g3
