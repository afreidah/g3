server:
  listen_addr: "0.0.0.0:9000"
  log_level: "info"

gmail:
  client_id: "${GMAIL_CLIENT_ID}"
  client_secret: "${GMAIL_CLIENT_SECRET}"
  refresh_token: "${GMAIL_REFRESH_TOKEN}"

# Metadata index: "sqlite" (default) or "postgres"
# SQLite requires a persistent volume; PostgreSQL allows any-node scheduling.
database:
  driver: "sqlite"
  path: "/data/g3/metadata.db"
  # PostgreSQL example:
  # driver: "postgres"
  # host: "haproxy-postgres.service.consul"
  # port: 5433
  # database: "g3"
  # user: "${G3_DB_USER}"
  # password: "${G3_DB_PASSWORD}"
  # ssl_mode: "require"
  # max_conns: 5

buckets:
  - name: "backups"
    credentials:
      - access_key_id: "changeme"
        secret_access_key: "changeme"

telemetry:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: "tempo:4317"
    insecure: true
    sample_rate: 1.0
